name: Validate and release Top Gun HD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify committed release and rebuild from source
        run: |
          python scripts/verify_release.py
          python scripts/build_pack.py
          python scripts/verify_release.py
          git diff --exit-code -- pack/ source/build_manifest.json
      - name: Package release assets
        run: python scripts/package_release.py
      - name: Read version
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Top-Gun-HD-release
          path: output/release/
          if-no-files-found: error
          retention-days: 30

  release:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.validate.outputs.version == '1.0.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-v1.0.0
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download verified assets and publish approved release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name Top-Gun-HD-release --dir release-assets
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'v1.0.0 already exists; leaving the published release unchanged.'
            exit 0
          fi
          gh release create v1.0.0 release-assets/* \
            --target "$RELEASE_COMMIT" \
            --title 'Top Gun HD v1.0.0' \
            --notes-file RELEASE_NOTES.md \
            --latest
